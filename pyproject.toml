[project]
name = "cs-monitor"
version = "0.1.0"
description = "CS2 饰品价格波动监控系统 (CLI + Web)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pyjwt>=2.8.0",
    "websockets>=12.0",
    "tenacity>=8.2.0",
    "pyyaml>=6.0",
    "bcrypt>=5.0.0",
    "cryptography>=48.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "notify", "storage", "utils", "web"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
